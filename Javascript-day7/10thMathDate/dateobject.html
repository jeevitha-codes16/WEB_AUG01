<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>

        let result = new Date
        console.log(result.getDate())
        console.log(result.getDay()) //monday starts with 1
        console.log(result.getMonth()) // january starts with 0
        console.log(result.getFullYear())
        console.log(result.getTime())

        console.log(result.toLocaleTimeString())
        console.log(result.getMinutes())
        console.log(result.getSeconds())
    </Script>
</body>
</html>
