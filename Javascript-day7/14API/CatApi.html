<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <img src = "cat"  height="300"  width="300">

 <button id="btn" onclick="getImage()">get cat</button>
    
 <script>
    function getImage(){

        const catimage = document.getElementById("cat")

        fetch('https://s3.us-west-2.amazonaws.com/cdn2.thecatapi.com/images/XWqBv4Dnh.jpg')
   
        .then( res =>json() )

        .then(data => catimage.src (data[0].url))


        .catch(err => console.log('error getting image', err))
   
    }

    getImage()

 </script>
</body>
</html>
