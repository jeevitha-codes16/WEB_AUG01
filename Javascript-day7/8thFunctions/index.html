<body>
    <script>
        //Function - help us to do a specific task , example - addition, calculating bills

        //1. function keyword functionname() { task }

        function greet() {
            //Body - instruction/task
            console.log("hello world")
        }

        greet()  //calling the function

        //2. function with parameter - (parameter/argument - dummy variable)
        function greeting(name) {
            console.log(`hello ${name},welcome back`)
        }

          greeting("rita") 
          greeting("john")
        greeting("james")
    </script>
</body>
