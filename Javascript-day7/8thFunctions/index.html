<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>

<body>
    <script>
        //Function - help us to do a specific task , example - addition, calculating bills

        //1. function keyword functionname() { task }

        function greet() {
            //Body - instruction/task
            console.log("hello world")
        }

        greet()  //calling the function

        //2. function with parameter - (parameter/argument - dummy variable)
        function greeting(name) {
            console.log(`hello ${name},welcome back`)
        }

          greeting("rita") 
          greeting("john")
        greeting("james")

        //3. function with return type
        function totalbill(price,quantity) {
            
            return price * quantity //to give something back

        }

        let result = totalbill(100,2) //function return the value of 200
        console.log(result)

        //4. arrow function => kogic in one single line

       let abc = ()=>{

            console.log("hello guys i am arrow function")
        }

        abc()  //calling the arrow function with variable

    </script>
</body>
</html>
