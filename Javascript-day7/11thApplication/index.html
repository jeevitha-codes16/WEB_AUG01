<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        //draw a dice and find the lucky No

        //dice - numbers between 1 to 6
        let luckyNo = Math.floor(Math.random() * 6) + 1;
        console.log(luckyNo)

      while(true){
        

        guessNo = prompt("enter your No between 1 to 6")
        //winning condition
        if(luckyNo == guessNo){
            alert("you won the game")
            break; //break means stop

      }else{
        alert('better luck next time')
      }
    }

    </Script>
</body>
</html>
