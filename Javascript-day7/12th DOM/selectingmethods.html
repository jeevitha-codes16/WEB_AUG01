<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="myp">Hello guys welcome to JS DOM</p>
     
    <div class="box">This is with 0 balls</div>
       <div class="box">This is with 1 balls</div>
    
       <p>this is a paragraph</p>

       <div class="abc" id="xyz">good morning</div>
       <div class="abc">good morning</div>
    

    <script>
        // selecting methods - different ways to select html tags

        //1. target single or individual HTML Tag - using ID

        //Document-webpage
        //Element - HTML tag

        const paragraphTag = document.getElementById("myp")  //paragraph tag from html body is in JS Now
        console.log(paragraphTag) 
        

        //2. select by class 

        const container = document.getElementsByClassName("box")

        console.log(container)
        console.log(container[1])

        //3.Tagname
        const para = document.getElementsByTagName("p")
        console.log(para)
        console.log(para[0])

        //4. querySelector() --> it follows CSS selector rule : #Idname , .classname , Tagname
        // it will only select the first element/tag
        const box = document.querySelector(".abc")
        console.log(box)

        //5.querySelectorAll() -- All the Elements/Tag

        const boxes = document.querySelectorAll(".abc")
        
        console.log(boxes)
        console.log(boxes[1])
    </script>
</body>
</html>
