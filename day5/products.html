<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
            background-color: antiquewhite;
            height: 100vh;
            display: flex;
            justify-content: center;

            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .product{
            border: 2px solid black ;
            border-radius: 12px;
            width: 250px;
            padding: 12px;
            margin-bottom: 15px;
            height: 300px;
            text-align: center;
            /* box-shadow: xaxis yaxis spread-radius colorname; */

            box-shadow:   4px   4px black ;
        }


        .product:hover{
            background-color: rgb(101, 11, 41);
            transition: 1s;
            transform: scale(1.03);
            color: antiquewhite;
        }

        .product img{
            width: 100%;
            height: 160px;
            object-fit: cover;

            border-radius: 12px;
        }
        .product button{
            background-color: cadetblue;
            padding: 10px;
            border-radius: 12px;
            border: none;
            width: 90%;
        }


    </Style>
</head>
<body>
    <div class="product">
        <img src="https://images.pexels.com/photos/9667336/pexels-photo-9667336.jpeg" height="150" width="150"> 
        <h2>Iphone16</h2>
        <p>Rs 1,20,000</p>
        <button>buy now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/15111004/pexels-photo-15111004.jpeg" height="150" width="150">
        <h2>Dslr</h2>
        <p>Rs 1,00,000 </p>
        <button>buy now</button>
    </div>

    
    <div class="product">
        <img src="https://images.pexels.com/photos/11945638/pexels-photo-11945638.jpeg" height="150" width="150">
        <h2>Headphones</h2>
        <p>Rs 50,000</p>
        <button>buy now</button>
    </div>
</body>
</html>
